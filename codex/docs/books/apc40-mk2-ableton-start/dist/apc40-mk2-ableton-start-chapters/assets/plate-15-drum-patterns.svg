    <text x="110" y="222" style="font: 700 11px Arial; fill: #fff;" text-anchor="middle">CLAP</text>
    <text x="182" y="222" style="font: 700 10px Menlo, monospace; fill: #9fb0c0;" text-anchor="middle">D1</text>
    <rect x="214" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#5a6572" stroke-width="1"/><rect x="270" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="326" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="382" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="438" y="200" width="52" height="34" rx="4" fill="#f4a62a" stroke="#5a6572" stroke-width="1"/><rect x="494" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="550" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="606" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="662" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#5a6572" stroke-width="1"/><rect x="718" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="774" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="830" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="886" y="200" width="52" height="34" rx="4" fill="#f4a62a" stroke="#5a6572" stroke-width="1"/><rect x="942" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="998" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="1054" y="200" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/>
  <rect x="64" y="250" width="92" height="34" rx="4" fill="#303945" stroke="#111" stroke-width="1"/>
    <text x="110" y="272" style="font: 700 11px Arial; fill: #fff;" text-anchor="middle">CL HAT</text>
    <text x="182" y="272" style="font: 700 10px Menlo, monospace; fill: #9fb0c0;" text-anchor="middle">F#1</text>
    <rect x="214" y="250" width="52" height="34" rx="4" fill="#2f80ed" stroke="#5a6572" stroke-width="1"/><rect x="270" y="250" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="326" y="250" width="52" height="34" rx="4" fill="#2f80ed" stroke="#39434f" stroke-width="1"/><rect x="382" y="250" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="438" y="250" width="52" height="34" rx="4" fill="#2f80ed" stroke="#5a6572" stroke-width="1"/><rect x="494" y="250" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="550" y="250" width="52" height="34" rx="4" fill="#2f80ed" stroke="#39434f" stroke-width="1"/><rect x="606" y="250" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="662" y="250" width="52" height="34" rx="4" fill="#2f80ed" stroke="#5a6572" stroke-width="1"/><rect x="718" y="250" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="774" y="250" width="52" height="34" rx="4" fill="#2f80ed" stroke="#39434f" stroke-width="1"/><rect x="830" y="250" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="886" y="250" width="52" height="34" rx="4" fill="#2f80ed" stroke="#5a6572" stroke-width="1"/><rect x="942" y="250" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="998" y="250" width="52" height="34" rx="4" fill="#2f80ed" stroke="#39434f" stroke-width="1"/><rect x="1054" y="250" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/>
  <rect x="64" y="300" width="92" height="34" rx="4" fill="#303945" stroke="#111" stroke-width="1"/>
    <text x="110" y="322" style="font: 700 11px Arial; fill: #fff;" text-anchor="middle">OP HAT</text>
    <text x="182" y="322" style="font: 700 10px Menlo, monospace; fill: #9fb0c0;" text-anchor="middle">A#1</text>
    <rect x="214" y="300" width="52" height="34" rx="4" fill="#141a22" stroke="#5a6572" stroke-width="1"/><rect x="270" y="300" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="326" y="300" width="52" height="34" rx="4" fill="#7a5cff" stroke="#39434f" stroke-width="1"/><rect x="382" y="300" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="438" y="300" width="52" height="34" rx="4" fill="#141a22" stroke="#5a6572" stroke-width="1"/><rect x="494" y="300" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="550" y="300" width="52" height="34" rx="4" fill="#7a5cff" stroke="#39434f" stroke-width="1"/><rect x="606" y="300" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="662" y="300" width="52" height="34" rx="4" fill="#141a22" stroke="#5a6572" stroke-width="1"/><rect x="718" y="300" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="774" y="300" width="52" height="34" rx="4" fill="#7a5cff" stroke="#39434f" stroke-width="1"/><rect x="830" y="300" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="886" y="300" width="52" height="34" rx="4" fill="#141a22" stroke="#5a6572" stroke-width="1"/><rect x="942" y="300" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="998" y="300" width="52" height="34" rx="4" fill="#7a5cff" stroke="#39434f" stroke-width="1"/><rect x="1054" y="300" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/>
  <text x="240" y="368" style="font: 700 11px Arial; fill: #cad4de;" text-anchor="middle">1</text><text x="296" y="368" style="font: 400 11px Arial; fill: #cad4de;" text-anchor="middle">2</text><text x="352" y="368" style="font: 400 11px Arial; fill: #cad4de;" text-anchor="middle">3</text><text x="408" y="368" style="font: 400 11px Arial; fill: #cad4de;" text-anchor="middle">4</text><text x="464" y="368" style="font: 700 11px Arial; fill: #cad4de;" text-anchor="middle">5</text><text x="520" y="368" style="font: 400 11px Arial; fill: #cad4de;" text-anchor="middle">6</text><text x="576" y="368" style="font: 400 11px Arial; fill: #cad4de;" text-anchor="middle">7</text><text x="632" y="368" style="font: 400 11px Arial; fill: #cad4de;" text-anchor="middle">8</text><text x="688" y="368" style="font: 700 11px Arial; fill: #cad4de;" text-anchor="middle">9</text><text x="744" y="368" style="font: 400 11px Arial; fill: #cad4de;" text-anchor="middle">10</text><text x="800" y="368" style="font: 400 11px Arial; fill: #cad4de;" text-anchor="middle">11</text><text x="856" y="368" style="font: 400 11px Arial; fill: #cad4de;" text-anchor="middle">12</text><text x="912" y="368" style="font: 700 11px Arial; fill: #cad4de;" text-anchor="middle">13</text><text x="968" y="368" style="font: 400 11px Arial; fill: #cad4de;" text-anchor="middle">14</text><text x="1024" y="368" style="font: 400 11px Arial; fill: #cad4de;" text-anchor="middle">15</text><text x="1080" y="368" style="font: 400 11px Arial; fill: #cad4de;" text-anchor="middle">16</text>
  <text x="64" y="404" style="font: 400 11px Arial, sans-serif; fill: #edf2f7;" text-anchor="start">KICK on every beat (1, 5, 9, 13) is the Italo-disco pulse. CLAP on beats 2 and 4 (steps 5, 13).</text>
  <text x="64" y="428" style="font: 400 11px Arial, sans-serif; fill: #edf2f7;" text-anchor="start">Closed hats on every eighth (odd steps). Open hats on the off-beats (3, 7, 11, 15) - the disco 'and'.</text>
  <rect x="42" y="492" width="1116" height="200" rx="10" fill="#fff" stroke="#b8b2a7" stroke-width="1"/>
  <text x="64" y="524" class="label" text-anchor="start">Scene variations from the same three clips</text>
  <text x="64" y="554" class="small" text-anchor="start">INTRO: copy KICK clip, delete steps 5 and 13, lower velocity to ~70. Copy CL HAT only.</text><text x="64" y="580" class="small" text-anchor="start">LIFT: same as GROOVE plus OP HAT velocity up to ~110 for urgency.</text><text x="64" y="606" class="small" text-anchor="start">CHORUS: GROOVE patterns as-is; add a CLAP fill in the last bar (steps 13, 14, 15, 16).</text><text x="64" y="632" class="small" text-anchor="start">BREAK: delete KICK and CLAP clips entirely; keep only CL HAT at velocity ~50 (ghost hats).</text><text x="64" y="658" class="small" text-anchor="start">TAG/END: GROOVE patterns; you will fade and stop them from the APC, not edit them.</text>
</svg>
