<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="plate-15-drum-patterns.svg">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #20242b; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #6b7280; }
