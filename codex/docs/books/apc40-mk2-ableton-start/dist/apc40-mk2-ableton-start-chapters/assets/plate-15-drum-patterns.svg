  <rect width="100%" height="100%" fill="#f6f3eb"/>
  <text x="34" y="42" class="title" text-anchor="start">The three drum clips, step by step</text><text x="36" y="66" class="subtitle" text-anchor="start">One bar = 16 steps. Numbers below show the 1/16 grid; bold columns are the beats.</text>
  <rect x="42" y="92" width="1116" height="380" rx="12" fill="#20242b" stroke="#111" stroke-width="1"/>
  <text x="64" y="124" style="font: 700 13px Arial, sans-serif; fill: #edf2f7;" text-anchor="start">GROOVE scene drum patterns (draw these exactly, then adjust by ear)</text>
  <rect x="64" y="150" width="92" height="34" rx="4" fill="#303945" stroke="#111" stroke-width="1"/>
    <text x="110" y="172" style="font: 700 11px Arial; fill: #fff;" text-anchor="middle">KICK</text>
    <text x="182" y="172" style="font: 700 10px Menlo, monospace; fill: #9fb0c0;" text-anchor="middle">C1</text>
    <rect x="214" y="150" width="52" height="34" rx="4" fill="#3aa657" stroke="#5a6572" stroke-width="1"/><rect x="270" y="150" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="326" y="150" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="382" y="150" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="438" y="150" width="52" height="34" rx="4" fill="#3aa657" stroke="#5a6572" stroke-width="1"/><rect x="494" y="150" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="550" y="150" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="606" y="150" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="662" y="150" width="52" height="34" rx="4" fill="#3aa657" stroke="#5a6572" stroke-width="1"/><rect x="718" y="150" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="774" y="150" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="830" y="150" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="886" y="150" width="52" height="34" rx="4" fill="#3aa657" stroke="#5a6572" stroke-width="1"/><rect x="942" y="150" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="998" y="150" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/><rect x="1054" y="150" width="52" height="34" rx="4" fill="#141a22" stroke="#39434f" stroke-width="1"/>
