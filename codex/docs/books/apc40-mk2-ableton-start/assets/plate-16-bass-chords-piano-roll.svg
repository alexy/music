<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="plate-16-bass-chords-piano-roll.svg">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #20242b; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #6b7280; }
      .label { font: 700 13px Arial, sans-serif; fill: #20242b; }
      .small { font: 400 11px Arial, sans-serif; fill: #20242b; }
      .tiny { font: 400 9px Arial, sans-serif; fill: #20242b; }
      .white { fill: #fff; }
      .mono { font: 700 10px Menlo, Consolas, monospace; fill: #20242b; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#f6f3eb"/>
  <text x="34" y="42" class="title" text-anchor="start">Octave bass and chord pads in the piano roll</text><text x="36" y="66" class="subtitle" text-anchor="start">The practice key is A minor. Draw these blocks, then trust your ears over the diagram.</text>
  <rect x="42" y="92" width="1116" height="240" rx="12" fill="#20242b" stroke="#111" stroke-width="1"/>
  <text x="64" y="122" style="font: 700 13px Arial, sans-serif; fill: #edf2f7;" text-anchor="start">BASS clip (1 bar, loops): the Italo octave bounce</text>
  <rect x="64" y="146" width="52" height="50" rx="4" fill="#303945" stroke="#111" stroke-width="1"/><text x="90" y="176" style="font: 700 11px Arial; fill: #fff;" text-anchor="middle">A2</text><rect x="64" y="206" width="52" height="50" rx="4" fill="#303945" stroke="#111" stroke-width="1"/><text x="90" y="236" style="font: 700 11px Arial; fill: #fff;" text-anchor="middle">A1</text>
  <rect x="136" y="206" width="112" height="50" rx="4" fill="#7a5cff" stroke="#111" stroke-width="1"/><text x="192" y="236" style="font: 700 10px Arial; fill: #fff;" text-anchor="middle">A1</text><rect x="260" y="146" width="112" height="50" rx="4" fill="#8f7bff" stroke="#111" stroke-width="1"/><text x="316" y="176" style="font: 700 10px Arial; fill: #fff;" text-anchor="middle">A2</text><rect x="384" y="206" width="112" height="50" rx="4" fill="#7a5cff" stroke="#111" stroke-width="1"/><text x="440" y="236" style="font: 700 10px Arial; fill: #fff;" text-anchor="middle">A1</text><rect x="508" y="146" width="112" height="50" rx="4" fill="#8f7bff" stroke="#111" stroke-width="1"/><text x="564" y="176" style="font: 700 10px Arial; fill: #fff;" text-anchor="middle">A2</text><rect x="632" y="206" width="112" height="50" rx="4" fill="#7a5cff" stroke="#111" stroke-width="1"/><text x="688" y="236" style="font: 700 10px Arial; fill: #fff;" text-anchor="middle">A1</text><rect x="756" y="146" width="112" height="50" rx="4" fill="#8f7bff" stroke="#111" stroke-width="1"/><text x="812" y="176" style="font: 700 10px Arial; fill: #fff;" text-anchor="middle">A2</text><rect x="880" y="206" width="112" height="50" rx="4" fill="#7a5cff" stroke="#111" stroke-width="1"/><text x="936" y="236" style="font: 700 10px Arial; fill: #fff;" text-anchor="middle">A1</text><rect x="1004" y="146" width="112" height="50" rx="4" fill="#8f7bff" stroke="#111" stroke-width="1"/><text x="1060" y="176" style="font: 700 10px Arial; fill: #fff;" text-anchor="middle">A2</text>
  <text x="64" y="290" style="font: 400 11px Arial, sans-serif; fill: #edf2f7;" text-anchor="start">Eighth notes alternating low A (A1) and the A one octave up (A2). Every note the same length.</text>
  <text x="64" y="314" style="font: 400 11px Arial, sans-serif; fill: #edf2f7;" text-anchor="start">When the chords change in longer clips, move the whole pattern to the new root: F, C, G.</text>
  <rect x="42" y="356" width="1116" height="250" rx="12" fill="#20242b" stroke="#111" stroke-width="1"/>
  <text x="64" y="386" style="font: 700 13px Arial, sans-serif; fill: #edf2f7;" text-anchor="start">CHORDS clip (4 bars, loops): one held chord per bar</text>
  <rect x="90" y="410" width="250" height="120" rx="8" fill="#7a5cff" stroke="#111" stroke-width="1"/><text x="215" y="462" style="font: 700 22px Arial; fill: #fff;" text-anchor="middle">Am</text><text x="215" y="492" style="font: 400 12px Arial; fill: #f2f2f2;" text-anchor="middle">A2 C3 E3</text><rect x="358" y="410" width="250" height="120" rx="8" fill="#d95f9f" stroke="#111" stroke-width="1"/><text x="483" y="462" style="font: 700 22px Arial; fill: #fff;" text-anchor="middle">F</text><text x="483" y="492" style="font: 400 12px Arial; fill: #f2f2f2;" text-anchor="middle">F2 A2 C3</text><rect x="626" y="410" width="250" height="120" rx="8" fill="#189a86" stroke="#111" stroke-width="1"/><text x="751" y="462" style="font: 700 22px Arial; fill: #fff;" text-anchor="middle">C</text><text x="751" y="492" style="font: 400 12px Arial; fill: #f2f2f2;" text-anchor="middle">C3 E3 G3</text><rect x="894" y="410" width="250" height="120" rx="8" fill="#f4a62a" stroke="#111" stroke-width="1"/><text x="1019" y="462" style="font: 700 22px Arial; fill: #fff;" text-anchor="middle">G</text><text x="1019" y="492" style="font: 400 12px Arial; fill: #f2f2f2;" text-anchor="middle">G2 B2 D3</text>
  <text x="64" y="560" style="font: 400 11px Arial, sans-serif; fill: #edf2f7;" text-anchor="start">Bar 1: A minor. Bar 2: F major. Bar 3: C major. Bar 4: G major. Hold each chord for the whole bar.</text>
  <text x="64" y="584" style="font: 400 11px Arial, sans-serif; fill: #edf2f7;" text-anchor="start">This is a stand-in progression for practice. If you rebuild the song by ear, adjust chords to match what you hear.</text>
  <rect x="42" y="630" width="1116" height="62" rx="8" fill="#fff7de" stroke="#e0b54b" stroke-width="1"/>
  <text x="66" y="656" class="label" text-anchor="start">LEAD starter: play or draw a short answer phrase (5 to 9 notes) from the A minor scale in bar 4 only.</text>
  <text x="66" y="678" class="small" text-anchor="start">Leaving bars 1-3 empty makes the lead feel like a hook, not wallpaper.</text>
</svg>
