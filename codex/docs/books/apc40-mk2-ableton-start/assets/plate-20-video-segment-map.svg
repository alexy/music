  <text x="912" y="176" class="small" text-anchor="start">Watch the chunk once</text><text x="912" y="200" class="small" text-anchor="start">without touching gear.</text><text x="912" y="224" class="small" text-anchor="start"></text><text x="912" y="248" class="small" text-anchor="start">Do the chapter with</text><text x="912" y="272" class="small" text-anchor="start">your own hands.</text><text x="912" y="296" class="small" text-anchor="start"></text><text x="912" y="320" class="small" text-anchor="start">Rewatch only the part</text><text x="912" y="344" class="small" text-anchor="start">that surprised you.</text><text x="912" y="368" class="small" text-anchor="start"></text><text x="912" y="392" class="small" text-anchor="start">Never binge all the</text><text x="912" y="416" class="small" text-anchor="start">videos in one sitting -</text><text x="912" y="440" class="small" text-anchor="start">fingers learn faster</text><text x="912" y="464" class="small" text-anchor="start">than eyes.</text>
