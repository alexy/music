<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPK Mini MK3 GarageBand Loop Lab</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #62707d;
      --paper: #f5f1e8;
      --panel: #fffdf8;
      --line: #d7d0c1;
      --teal: #197278;
      --green: #2a9d8f;
      --gold: #e9c46a;
      --coral: #e76f51;
      --blue: #3d5a80;
      --dark: #141a22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 26px 16px 42px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 0 0 18px;
      max-width: 880px;
      color: var(--muted);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(330px, 1.15fr) minmax(310px, .85fr);
      gap: 16px;
      align-items: start;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 15px;
    }
    .mpk {
      border-radius: 8px;
      background: #20252d;
      box-shadow: inset 0 0 0 2px #0d1117;
      padding: 16px;
      color: #e8eef3;
    }
    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 750;
    }
    .screen {
      min-width: 112px;
      padding: 6px 8px;
      border: 2px solid #0d1117;
      border-radius: 4px;
      color: #24303c;
      background: #eaf6ff;
      font-size: 11px;
      text-align: center;
    }
    .top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }
    .pads, .knobs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }
    .pad {
      aspect-ratio: 1;
      border: 2px solid #485360;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: #d9e1e9;
      background: #141a22;
      font-size: 12px;
      font-weight: 750;
      text-align: center;
      transition: background .15s, color .15s, transform .15s, box-shadow .15s;
    }
    .pad.active {
      color: #061311;
      background: var(--green);
      transform: translateY(2px);
      box-shadow: 0 0 18px rgba(42, 157, 143, .8);
    }
    .knob-wrap {
      display: grid;
      justify-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .knob {
      width: min(56px, 100%);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid #0b0f14;
      background: radial-gradient(circle at 38% 32%, #717b86, #252c35 58%, #0c1016);
      position: relative;
    }
    .knob::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 12%;
      width: 3px;
      height: 38%;
      border-radius: 2px;
      background: var(--gold);
      transform: translateX(-50%) rotate(var(--turn, -25deg));
      transform-origin: 50% 100%;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      margin: 14px 0 9px;
    }
    .button {
      min-height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid #3e4650;
      border-radius: 4px;
      color: #d8e1e8;
      background: #141a22;
      font-size: 10px;
      font-weight: 750;
      text-align: center;
    }
    .button.active { background: var(--coral); color: white; }
    .keys {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 2px;
      height: 150px;
      align-items: stretch;
    }
    .key {
      position: relative;
      border: 1px solid #ccd3d9;
      border-radius: 0 0 5px 5px;
      background: #f7f6f1;
      transition: background .15s, transform .15s;
    }
    .key::after {
      content: attr(data-note);
      position: absolute;
      left: 50%;
      bottom: 5px;
      transform: translateX(-50%);
      color: #56616e;
      font-size: 10px;
      font-weight: 750;
    }
    .key.black::before {
      content: "";
      position: absolute;
      top: 0;
      left: 68%;
      z-index: 2;
      width: 62%;
      height: 58%;
      border-radius: 0 0 4px 4px;
      background: #070a0e;
    }
    .key.black::after { display: none; }
    .key.active {
      background: var(--gold);
      transform: translateY(4px);
    }
    .timeline {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }
    .track {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 8px;
      align-items: center;
    }
    .label { color: var(--muted); font-weight: 750; }
    .lane {
      position: relative;
      height: 24px;
      overflow: hidden;
      border-radius: 4px;
      background: #e9e2d6;
    }
    .region {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--x);
      width: var(--w);
      border-radius: 4px;
      background: var(--c);
      opacity: .25;
    }
    .region.on { opacity: 1; }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--play, 0%);
      width: 3px;
      background: #111820;
    }
    .side h2 { margin: 0 0 8px; font-size: 23px; }
    .meta { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
    .pill {
      padding: 5px 8px;
      border-radius: 999px;
      color: #24303a;
      background: #ebe4d8;
      font-size: 12px;
      font-weight: 750;
    }
    .step-text { min-height: 132px; color: var(--muted); }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 12px; }
    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 13px;
      color: white;
      background: var(--teal);
      font-weight: 750;
      cursor: pointer;
    }
    button.secondary { color: var(--ink); background: var(--gold); }
    .steps { display: grid; gap: 7px; margin-top: 13px; }
    .step {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border-radius: 6px;
      color: var(--muted);
      background: #f0eadf;
      cursor: pointer;
    }
    .step.current { color: var(--ink); background: #dff1ee; font-weight: 750; }
    .num {
      height: 25px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--blue);
      font-size: 12px;
      font-weight: 750;
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .keys { height: 130px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>MPK Mini MK3 GarageBand Loop Lab</h1>
    <p class="subtitle">Build a four-track GarageBand loop with the controller surface: pads for drums, keys for bass/chords/hook, knobs for Smart Controls or automation.</p>
    <section class="layout">
      <div class="panel">
        <div class="mpk">
          <div class="brand"><span>AKAI MPK mini MK3</span><span class="screen">GB Loop<br>Program 1</span></div>
          <div class="top"><div class="pads" id="pads"></div><div class="knobs" id="knobs"></div></div>
          <div class="buttons" id="buttons"></div>
          <div class="keys" id="keys"></div>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>
      <aside class="panel side">
        <h2 id="title">Connect</h2>
        <div class="meta"><span class="pill" id="mode">Setup</span><span class="pill">92 BPM</span><span class="pill">4 bars</span></div>
        <div class="step-text" id="body"></div>
        <div class="actions">
          <button id="prev" type="button">Back</button>
          <button id="next" type="button">Next</button>
          <button class="secondary" id="play" type="button">Play Steps</button>
        </div>
        <div class="steps" id="steps"></div>
      </aside>
    </section>
  </main>
  <script>
    const keyNames = ["C2","C#2","D2","D#2","E2","F2","F#2","G2","G#2","A2","A#2","B2","C3","C#3","D3"];
    const black = new Set(["C#2","D#2","F#2","G#2","A#2","C#3","D#3"]);
    const buttonNames = ["OCT-","OCT+","FULL","REPEAT","ARP","PROG"];
    const tracks = [["Drums","#197278",5,85],["Bass","#2a9d8f",20,70],["Chords","#e9c46a",38,52],["Hook","#e76f51",58,32],["FX","#3d5a80",78,16]];
    const steps = [
      {title:"Connect", mode:"Setup", text:"Connect the MPK by USB, open GarageBand, create an Empty Project, and add a Software Instrument track. Play any key before changing settings.", pads:[], keys:[], buttons:["PROG"], knobs:{}, regions:[]},
      {title:"Cycle Loop", mode:"GarageBand", text:"Set tempo to 92 BPM and turn on the yellow cycle region for bars 1-4. This gives you a safe loop lane for repeated takes.", pads:[], keys:[], buttons:[], knobs:{8:45}, regions:[]},
      {title:"Drums", mode:"Pads", text:"Choose a drum kit. Turn Full Level on. Record Pad 1 kick, Pad 2 snare/clap, and Pad 3 closed hat. Add Pad 4 open hat only after the basic groove works.", pads:[1,2,3,4], keys:[], buttons:["FULL"], knobs:{}, regions:["Drums"]},
      {title:"Hat Repeat", mode:"Note Repeat", text:"Use Note Repeat on Pad 3 for even eighth or sixteenth-note hats. If it drifts, turn repeat off and record hats manually.", pads:[3], keys:[], buttons:["REPEAT","FULL"], knobs:{}, regions:["Drums"]},
      {title:"Bass", mode:"Keys", text:"Switch to a synth bass, press Octave Down once, and record C2, G2, C2, rest. Keep it simple and short.", pads:[], keys:["C2","G2"], buttons:["OCT-"], knobs:{1:-20}, regions:["Drums","Bass"]},
      {title:"Chords", mode:"Keys", text:"Return to center octave. Record C minor then Ab major with two or three notes per chord. Do not overplay the loop.", pads:[], keys:["C2","D#2","G2","G#2","C3"], buttons:[], knobs:{3:10,4:22}, regions:["Drums","Bass","Chords"]},
      {title:"Hook", mode:"Lead", text:"Press Octave Up once and play a five-note hook in the upper range. Use the joystick only on the last note.", pads:[], keys:["G2","A#2","C3","D3"], buttons:["OCT+"], knobs:{1:25,7:32}, regions:["Drums","Bass","Chords","Hook"]},
      {title:"Knob Move", mode:"Smart Controls", text:"Open Smart Controls. Map or automate K1 as filter/tone and K8 as reverb. Record one slow K1 opening across the four-bar loop.", pads:[], keys:["C3"], buttons:[], knobs:{1:55,8:45}, regions:["Drums","Bass","Chords","Hook","FX"]},
      {title:"Arrange", mode:"Export", text:"Duplicate the loop: drums only, add bass, add chords, add hook, then final bar with reverb. Export audio when the controller performance feels clear.", pads:[8], keys:[], buttons:[], knobs:{8:60}, regions:["Drums","Bass","Chords","Hook","FX"]}
    ];
    let index = 0, timer = null, playing = false;
    function build() {
      pads.innerHTML = Array.from({length:8},(_,i)=>`<div class="pad" data-n="${i+1}">PAD ${i+1}</div>`).join("");
      knobs.innerHTML = Array.from({length:8},(_,i)=>`<div class="knob-wrap"><div class="knob" data-n="${i+1}"></div><div>K${i+1}</div></div>`).join("");
      buttons.innerHTML = buttonNames.map(n=>`<div class="button" data-name="${n}">${n}</div>`).join("");
      keys.innerHTML = keyNames.map(n=>`<div class="key${black.has(n) ? " black" : ""}" data-note="${n}"></div>`).join("");
      timeline.innerHTML = tracks.map(([n,c,x,w])=>`<div class="track"><div class="label">${n}</div><div class="lane"><div class="region" data-track="${n}" style="--c:${c};--x:${x}%;--w:${w}%"></div><div class="playhead"></div></div></div>`).join("");
      steps.forEach((s,i)=>{ const el=document.createElement("div"); el.className="step"; el.dataset.i=i; el.innerHTML=`<div class="num">${i+1}</div><div>${s.title}</div>`; el.onclick=()=>setStep(i); document.getElementById("steps").appendChild(el); });
    }
    function setStep(i) {
      index = (i + steps.length) % steps.length;
      const s = steps[index];
      title.textContent = s.title; mode.textContent = s.mode; body.textContent = s.text;
      document.querySelectorAll(".pad").forEach(el=>el.classList.toggle("active", s.pads.includes(Number(el.dataset.n))));
      document.querySelectorAll(".key").forEach(el=>el.classList.toggle("active", s.keys.includes(el.dataset.note)));
      document.querySelectorAll(".button").forEach(el=>el.classList.toggle("active", s.buttons.includes(el.dataset.name)));
      document.querySelectorAll(".knob").forEach(el=>el.style.setProperty("--turn", `${s.knobs[Number(el.dataset.n)] ?? -25}deg`));
      document.querySelectorAll(".region").forEach(el=>el.classList.toggle("on", s.regions.includes(el.dataset.track)));
      document.querySelectorAll(".step").forEach(el=>el.classList.toggle("current", Number(el.dataset.i) === index));
      document.querySelectorAll(".playhead").forEach(el=>el.style.setProperty("--play", `${Math.min(94,index*11)}%`));
    }
    function toggle() {
      playing = !playing; play.textContent = playing ? "Pause" : "Play Steps";
      if (playing) timer = setInterval(()=>setStep(index+1), 1900); else clearInterval(timer);
    }
    build(); setStep(0);
    prev.onclick = () => setStep(index - 1);
    next.onclick = () => setStep(index + 1);
    play.onclick = toggle;
  </script>
</body>
</html>
